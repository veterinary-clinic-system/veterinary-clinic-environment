name: veterinary-clinic-system

# Ha tang rieng cua project veterinary-clinic-system - PostgreSQL + Redis + MinIO.
# Tach khoi veterinary-clinic-backend/ thanh thu muc doc lap de ranh gioi ro rang:
# day la ha tang DUNG RIENG cho project nay, khong dung chung voi bat ky project nao
# khac tren may (khac voi environment-3rd - la ha tang dung chung cua mot project
# khac, KHONG lien quan gi den veterinary-clinic-system).
#
# CONG HOST DA DOI so voi mac dinh cua tung image: may dev nay co san mot PostgreSQL
# 18 cai truc tiep tren Windows chiem cong 5432, va mot container cua project khac
# chiem cong 6379. Doi sang 5433/6380 o phia host de tranh xung dot - ben trong mang
# Docker cua chinh compose nay, cac container van goi nhau qua cong mac dinh
# 5432/6379 (xem block `environment:` trong veterinary-clinic-backend/docker-compose.yml).
services:
  veterinary-clinic-postgres:
    image: postgres:16-alpine
    container_name: veterinary-clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-vetclinic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vetclinic}
      POSTGRES_DB: ${DB_DATABASE:-veterinary_clinic}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - veterinary-clinic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-vetclinic}']
      interval: 5s
      timeout: 5s
      retries: 10

  veterinary-clinic-redis:
    image: redis:7-alpine
    container_name: veterinary-clinic-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - veterinary-clinic-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  veterinary-clinic-minio:
    image: minio/minio:latest
    container_name: veterinary-clinic-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-vetclinic}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-vetclinic123}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - veterinary-clinic-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  veterinary-clinic-postgres-data:
  veterinary-clinic-redis-data:
  veterinary-clinic-minio-data:
